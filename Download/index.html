<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        #calculator {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 23%;
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div id="calculator">
    <form action="#" method="get">
        <input type="text" id="result" name="result" disabled>
        <div>
            <button type="button" onclick="document.getElementById('result').value = '';">C</button>
            <button type="button" onclick="document.getElementById('result').value += '7';">7</button>
            <button type="button" onclick="document.getElementById('result').value += '8';">8</button>
            <button type="button" onclick="document.getElementById('result').value += '9';">9</button>
            <button type="button" onclick="document.getElementById('result').value += '/';">/</button>
        </div>
        <div>
            <button type="button" onclick="document.getElementById('result').value += '4';">4</button>
            <button type="button" onclick="document.getElementById('result').value += '5';">5</button>
            <button type="button" onclick="document.getElementById('result').value += '6';">6</button>
            <button type="button" onclick="document.getElementById('result').value += '*';">*</button>
        </div>
        <div>
            <button type="button" onclick="document.getElementById('result').value += '1';">1</button>
            <button type="button" onclick="document.getElementById('result').value += '2';">2</button>
            <button type="button" onclick="document.getElementById('result').value += '3';">3</button>
            <button type="button" onclick="document.getElementById('result').value += '-';">-</button>
        </div>
        <div>
            <button type="button" onclick="document.getElementById('result').value += '0';">0</button>
            <button type="button" onclick="document.getElementById('result').value = eval(document.getElementById('result').value);">=</button>
            <button type="button" onclick="document.getElementById('result').value += '+';">+</button>
        </div>
    </form>
</div>

</body>
</html>
